<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="How it works: 1. Host your game. 2. Your friend joins. 3. Build together.">
  <defs>
    <filter id="shadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.32"/>
    </filter>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#333333"/><stop offset="1" stop-color="#2A2A2A"/>
    </linearGradient>
    <g id="cursor"><path d="M0 0 L0 30 L7.8 22.8 L13 34 L17.5 31.8 L12.3 20.8 L22.6 19.3 Z" stroke-width="3" stroke-linejoin="round" paint-order="stroke"/></g>
  </defs>
  <style>
    text { font-family: Ubuntu, "Segoe UI", system-ui, -apple-system, Cantarell, "Noto Sans", "Helvetica Neue", Arial, sans-serif; }
    .t { font-size: 19px; font-weight: 700; fill: #F7F7F7; }
    .b { font-size: 15px; fill: #9C9C9C; }
    .n { font-size: 17px; font-weight: 700; fill: #FFFFFF; }
  </style>

  <!-- ─── card 1 ─── -->
  <g transform="translate(20 14)">
    <rect width="264" height="290" rx="16" fill="url(#card)" stroke="#131313" stroke-width="1.5" filter="url(#shadow)"/>
    <!-- mini window: password + button -->
    <rect x="20" y="20" width="224" height="124" rx="12" fill="#1D1D1D" stroke="#131313"/>
    <circle cx="36" cy="36" r="4.5" fill="#C7162B"/><circle cx="50" cy="36" r="4.5" fill="#F99B11"/><circle cx="64" cy="36" r="4.5" fill="#12A029"/>
    <text x="36" y="70" font-size="12" font-weight="700" fill="#9C9C9C" letter-spacing="1">PASSWORD</text>
    <rect x="36" y="78" width="192" height="26" rx="6" fill="#272727" stroke="#E95420" stroke-width="1.5"/>
    <text x="46" y="96" font-size="15" fill="#F7F7F7" letter-spacing="2">•••••••••••</text>
    <rect x="36" y="112" width="128" height="22" rx="6" fill="#0E8420"/>
    <text x="100" y="127.5" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Start hosting</text>
    <circle cx="36" cy="182" r="16" fill="#E95420"/><text x="36" y="188" class="n" text-anchor="middle">1</text>
    <text x="62" y="189" class="t">Host your game</text>
    <text class="b"><tspan x="20" y="224">Press Start hosting. The</tspan><tspan x="20" y="246">app makes a strong</tspan><tspan x="20" y="268">password for you.</tspan></text>
  </g>

  <!-- arrow -->
  <path d="M290 159 l14 0 m-6 -7 l7 7 l-7 7" fill="none" stroke="#E95420" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ─── card 2 ─── -->
  <g transform="translate(318 14)">
    <rect width="264" height="290" rx="16" fill="url(#card)" stroke="#131313" stroke-width="1.5" filter="url(#shadow)"/>
    <!-- notification toast -->
    <rect x="20" y="30" width="224" height="104" rx="14" fill="#1D1D1D" stroke="#131313"/>
    <circle cx="48" cy="62" r="16" fill="#3E8F36"/>
    <text x="48" y="68" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">S</text>
    <text x="74" y="59" font-size="14" font-weight="700" fill="#F7F7F7">Sam wants to join</text>
    <text x="74" y="77" font-size="12" fill="#9C9C9C">Let them in?</text>
    <rect x="34" y="96" width="94" height="26" rx="6" fill="#0E8420"/>
    <text x="81" y="113.5" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Let in</text>
    <rect x="136" y="96" width="94" height="26" rx="6" fill="#383838"/>
    <text x="183" y="113.5" font-size="12.5" font-weight="700" fill="#F7F7F7" text-anchor="middle">Not now</text>
    <circle cx="232" cy="32" r="9" fill="#E95420">
      <animate attributeName="r" values="9;11;9" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="36" cy="182" r="16" fill="#E95420"/><text x="36" y="188" class="n" text-anchor="middle">2</text>
    <text x="62" y="189" class="t">Your friend joins</text>
    <text class="b"><tspan x="20" y="224">They type your address and</tspan><tspan x="20" y="246">password. You get a pop-up</tspan><tspan x="20" y="268">and let them in.</tspan></text>
  </g>

  <path d="M588 159 l14 0 m-6 -7 l7 7 l-7 7" fill="none" stroke="#E95420" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ─── card 3 ─── -->
  <g transform="translate(616 14)">
    <rect width="264" height="290" rx="16" fill="url(#card)" stroke="#131313" stroke-width="1.5" filter="url(#shadow)"/>
    <!-- mini scene -->
    <rect x="20" y="20" width="224" height="124" rx="12" fill="#1D1D1D" stroke="#131313"/>
    <path d="M40 124 L224 124" stroke="#3D3D3D" stroke-width="2"/>
    <path d="M60 124 L60 110 M100 124 L100 110 M140 124 L140 110 M180 124 L180 110" stroke="#2F2F2F" stroke-width="2"/>
    <!-- house block -->
    <path d="M70 124 L70 84 L100 62 L130 84 L130 124 Z" fill="#8A5A33"/>
    <rect x="92" y="98" width="16" height="26" fill="#6B4325"/>
    <!-- tree -->
    <rect x="178" y="104" width="8" height="20" fill="#8A5A33"/>
    <path d="M182 52 L182 106 L158 106 Z" fill="#5FBE52"/><path d="M182 52 L182 106 L206 106 Z" fill="#3E8F36"/>
    <!-- two cursors, one moving -->
    <g transform="translate(112 70)"><use href="#cursor" fill="#FFFFFF" stroke="#8A2F0D"/>
      <animateTransform attributeName="transform" type="translate" values="112 70; 140 58; 112 70" dur="4s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(196 84) scale(0.85)"><use href="#cursor" fill="#24303F" stroke="#FFFFFF"/>
      <animateTransform attributeName="transform" type="translate" values="196 84; 176 96; 196 84" dur="5s" repeatCount="indefinite" additive="replace"/>
    </g>
    <circle cx="36" cy="182" r="16" fill="#E95420"/><text x="36" y="188" class="n" text-anchor="middle">3</text>
    <text x="62" y="189" class="t">Build together</text>
    <text class="b"><tspan x="20" y="224">The app copies your game,</tspan><tspan x="20" y="246">opens Godot, and you see</tspan><tspan x="20" y="268">each other work, live.</tspan></text>
  </g>
</svg>
